function pct(a,b){return b>0?Math.round(a/b*100)+'%':'—'}function per90(v,min){return min>0?(v/min*90).toFixed(1):'0.0'}
function derived(m,pid){var v=valsFor(m,pid),min=pmins(m,pid),gkSot=v.gk_sot||((v.gk_save||0)+(v.gk_goal||0));return[
 ['Celność strzałów',pct(v.shot_on||0,v.shot||0)],['Konwersja strzałów',pct(v.goal||0,v.shot||0)],['Pojedynki',pct(v.duel_win||0,(v.duel_win||0)+(v.duel_loss||0))],['Główki',pct(v.aerial_win||0,(v.aerial_win||0)+(v.aerial_loss||0))],['Dryblingi',pct(v.drib_win||0,(v.drib_win||0)+(v.drib_loss||0))],['Pressing',pct(v.press_win||0,(v.press_win||0)+(v.press_loss||0))],['Dośrodkowania',pct(v.cross_good||0,(v.cross_good||0)+(v.cross_bad||0))],['Długie podania BR',pct(v.gk_long_good||0,(v.gk_long_good||0)+(v.gk_long_bad||0))],['Obrony BR',pct(v.gk_save||0,gkSot)],['Strzały / 90',per90(v.shot||0,min)],['Kluczowe podania / 90',per90(v.key||0,min)],['Progresywne podania / 90',per90((v.prog_pass||0)+(v.gk_prog||0),min)],['Odzyskania / 90',per90(v.recover||0,min)],['Odbiory / 90',per90(v.tackle||0,min)],['Przechwyty / 90',per90(v.inter||0,min)],['Wejścia w PK / 90',per90((v.box_ball||0)+(v.box_run||0),min)],['G+A / 90',per90((v.goal||0)+(v.assist||0),min)]
 ].filter(function(x){return x[1]!=='—'&&x[1]!=='0.0'})}
function keyStats(m,s){var pos=s.pos,v=valsFor(m,s.pid),keys=(DEFAULT_PROFILE[pos]||DEFAULT_PROFILE['ŚP']).slice(0,5);return keys.filter(function(k){return (v[k]||0)>0}).map(function(k){return metricMeta(k).name+': '+v[k]}).join(' • ')||'Brak zarejestrowanych statystyk'}
function openReport(mid){var m=getM(mid);if(!m)return;document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on')});report.classList.add('on');ptitle.textContent='Raport meczu';report.innerHTML='<div class="hero"><div><div class="eyebrow">PODSUMOWANIE MECZU</div><h1>'+m.us+':'+m.them+' vs '+esc(m.opp)+'</h1><p>'+esc(m.date)+' • '+esc(m.venue)+' • '+esc(m.comp||'—')+'</p></div><button class="btn" onclick="print()">EKSPORT PDF</button></div><div class="card tablewrap" style="padding:4px 10px"><table class="table"><thead><tr><th>Zawodnik</th><th>Pozycja</th><th>Minuty</th><th>Plusy</th><th>Błędy</th><th>Najważniejsze statystyki</th></tr></thead><tbody>'+m.squad.map(function(s){var p=getP(s.pid),plus=m.events.filter(function(e){return e.pid===s.pid&&e.type==='plus'}).length,minus=m.events.filter(function(e){return e.pid===s.pid&&e.type==='minus'}).length;return'<tr onclick="playerReport(\''+m.id+'\',\''+s.pid+'\')"><td><b>'+esc(p?p.name:'Zawodnik')+'</b></td><td>'+esc(s.pos)+'</td><td>'+pmins(m,s.pid)+'</td><td>'+plus+'</td><td>'+minus+'</td><td>'+esc(keyStats(m,s))+'</td></tr>'}).join('')+'</tbody></table></div>';goMark('report')}
function playerReport(mid,pid){var m=getM(mid),s=m.squad.find(function(x){return x.pid===pid}),p=getP(pid);if(!m||!s||!p)return;var v=valsFor(m,pid),d=derived(m,pid),plus=m.events.filter(function(e){return e.pid===pid&&e.type==='plus'}).length,minus=m.events.filter(function(e){return e.pid===pid&&e.type==='minus'}).length,notes=m.notes.filter(function(n){return n.pid===pid}).slice().sort(function(a,b){return a.min-b.min});var timeline=m.events.filter(function(e){return e.pid===pid&&e.type==='metric'&&e.val>0}).map(function(e){return{min:e.min,ts:e.ts,text:metricMeta(e.metric).name}}).concat(notes.map(function(n){return{min:n.min,ts:n.ts,text:n.text}})).sort(function(a,b){return a.ts-b.ts});report.innerHTML='<div class="hero"><div><div class="eyebrow">RAPORT ZAWODNIKA</div><h1>'+esc(p.name)+'</h1><p>'+esc(s.pos)+' • '+pmins(m,pid)+' min • '+m.us+':'+m.them+' vs '+esc(m.opp)+'</p></div><div class="row"><button class="btn" onclick="openReport(\''+mid+'\')">← DRUŻYNA</button><button class="btn" onclick="print()">PDF</button></div></div><div class="grid g4"><div class="card kpi"><span class="eyebrow">Plusy</span><strong>'+plus+'</strong><span class="mut">dobre zachowania</span></div><div class="card kpi"><span class="eyebrow">Błędy</span><strong>'+minus+'</strong><span class="mut">oznaczone LIVE</span></div><div class="card kpi"><span class="eyebrow">Minuty</span><strong>'+pmins(m,pid)+'</strong><span class="mut">w meczu</span></div><div class="card kpi"><span class="eyebrow">Pozycja</span><strong>'+esc(s.pos)+'</strong><span class="mut">końcowa</span></div></div><div class="section"><div><h3>Podstawowe dane</h3><p>Statystyki zarejestrowane w tym meczu.</p></div></div><div class="card"><div class="statsline" style="border:0;margin:0;padding:0">'+Object.keys(v).filter(function(k){return v[k]>0}).map(function(k){return'<span><b>'+esc(metricMeta(k).name)+': '+v[k]+'</b></span>'}).join('')+'</div></div><div class="section"><div><h3>Efektywność i /90</h3><p>Tylko obliczenia możliwe z zapisanych zdarzeń.</p></div></div><div class="effgrid">'+d.map(function(x){return'<div class="eff"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>'}).join('')+'</div><div class="grid g2" style="margin-top:18px"><div class="card"><h3>Plusy / do poprawy</h3>'+notes.map(function(n){return'<div class="ti"><b>'+n.min+'\'</b><span class="pill '+(n.type==='plus'?'good':n.type==='minus'?'bad':n.type==='improve'?'warn':'')+'">'+esc(n.type.toUpperCase())+'</span> '+esc(n.text)+'</div>'}).join('')+'</div><div class="card"><h3>Oś czasu</h3>'+timeline.map(function(x){return'<div class="ti"><b>'+x.min+'\'</b>'+esc(x.text)+'</div>'}).join('')+'</div></div>';goMark('report')}
function goMark(p){document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)})}
function aggregatePlayer(p){var ms=finished().filter(function(m){return m.squad.some(function(s){return s.pid===p.id})}),mins=ms.reduce(function(a,m){return a+pmins(m,p.id)},0),v={},plus=0,minus=0,pos={};ms.forEach(function(m){var s=m.squad.find(function(s){return s.pid===p.id});pos[s.pos]=(pos[s.pos]||0)+1;var x=valsFor(m,p.id);Object.keys(x).forEach(function(k){v[k]=(v[k]||0)+x[k]});plus+=m.events.filter(function(e){return e.pid===p.id&&e.type==='plus'}).length;minus+=m.events.filter(function(e){return e.pid===p.id&&e.type==='minus'}).length});return{ms:ms,mins:mins,v:v,plus:plus,minus:minus,pos:pos}}
function statsR(){var rows=S.players.map(function(p){var a=aggregatePlayer(p);return{p:p,a:a}}).sort(function(a,b){return b.a.mins-a.a.mins});stats.innerHTML='<div class="hero"><div><div class="eyebrow">SEZON '+esc(S.season)+'</div><h1>Statystyki</h1><p>Sumy, /90 i trendy bez automatycznego rankingu.</p></div></div><div class="card tablewrap" style="padding:4px 10px"><table class="table"><thead><tr><th>Zawodnik</th><th>Pozycja</th><th>Mecze</th><th>Minuty</th><th>Gole</th><th>Asysty</th><th>Plusy</th><th>Błędy</th></tr></thead><tbody>'+rows.map(function(r){return'<tr onclick="seasonPlayer(\''+r.p.id+'\')"><td><b>'+esc(r.p.name)+'</b></td><td>'+esc(r.p.pos)+'</td><td>'+r.a.ms.length+'</td><td>'+r.a.mins+'</td><td>'+(r.a.v.goal||0)+'</td><td>'+(r.a.v.assist||0)+'</td><td>'+r.a.plus+'</td><td>'+r.a.minus+'</td></tr>'}).join('')+'</tbody></table></div><div class="section"><div><h3>Własne statystyki LIVE</h3><p>Dodaj własny licznik i przypisz go do pozycji.</p></div></div><div class="card"><div class="customRow"><div class="field"><label>Nazwa</label><input id="cmn" placeholder="np. Wyblokowanie ŚO"></div><div class="field"><label>Pozycja</label><select id="cmp"><option>WSZYSTKIE</option>'+POS.map(function(p){return'<option value="'+p[0]+'">'+p[0]+'</option>'}).join('')+'</select></div><div class="field"><label>Kategoria</label><input id="cmc" value="Własne"></div><button class="btn primary" onclick="addCustomMetric()">DODAJ LICZNIK</button></div><div style="margin-top:12px">'+(S.customMetrics.length?S.customMetrics.map(function(c){return'<div class="profileRow"><b>'+esc(c.pos)+'</b><div><b>'+esc(c.name)+'</b><div class="sub">'+esc(c.cat||'Własne')+'</div></div><div class="actions"><button class="btn sm bad" onclick="delCustomMetric(\''+c.id+'\')">Usuń</button></div></div>'}).join(''):'<div class="mut">Brak własnych liczników.</div>')+'</div></div><div class="section"><div><h3>Backup</h3><p>Eksport wszystkich danych sezonu.</p></div><button class="btn" onclick="backup()">EKSPORT JSON</button></div>'}
function addCustomMetric(){if(!cmn.value.trim())return;S.customMetrics.push({id:'custom_'+id(),name:cmn.value.trim(),pos:cmp.value,cat:cmc.value.trim()||'Własne',live:true});save();statsR();flash('Dodano licznik')}
function delCustomMetric(cid){if(!confirm('Usunąć własny licznik?'))return;S.customMetrics=S.customMetrics.filter(function(c){return c.id!==cid});save();statsR()}
function spark(vals){if(!vals.length)return'';var w=180,h=44,max=Math.max.apply(null,vals.concat([1])),min=Math.min.apply(null,vals.concat([0])),pts=vals.map(function(v,i){var x=vals.length===1?0:i*(w/(vals.length-1)),y=h-4-((v-min)/(max-min||1))*(h-8);return x.toFixed(1)+','+y.toFixed(1)}).join(' ');return'<svg class="spark" viewBox="0 0 '+w+' '+h+'" aria-label="trend"><polyline fill="none" stroke="#151515" stroke-width="2.2" points="'+pts+'"/></svg>'}
function seasonPlayer(pid){var p=getP(pid);if(!p)return;var a=aggregatePlayer(p),metric=(p.pos==='BR'?'gk_save':'prog_pass'),trend=a.ms.slice().sort(function(x,y){return x.date.localeCompare(y.date)}).slice(-5).map(function(m){return +(per90(valsFor(m,pid)[metric]||0,pmins(m,pid))) });var posTxt=Object.keys(a.pos).map(function(k){return k+': '+a.pos[k]}).join(' • ');modalbox.innerHTML='<div class="row space"><div><div class="eyebrow">PROFIL SEZONOWY</div><h2 style="margin:4px 0">'+esc(p.name)+'</h2><div class="mut">'+esc(p.pos)+' • '+a.ms.length+' mecz. • '+a.mins+' min</div></div><button class="btn" onclick="closeM()">✕</button></div><div class="grid g4" style="margin-top:15px"><div class="card kpi"><span class="eyebrow">Gole</span><strong>'+(a.v.goal||0)+'</strong></div><div class="card kpi"><span class="eyebrow">Asysty</span><strong>'+(a.v.assist||0)+'</strong></div><div class="card kpi"><span class="eyebrow">Plusy</span><strong>'+a.plus+'</strong></div><div class="card kpi"><span class="eyebrow">Błędy</span><strong>'+a.minus+'</strong></div></div><div class="section"><div><h3>Pozycje</h3><p>'+esc(posTxt||'Brak')+'</p></div></div><div class="card"><div class="row space"><div><b>'+(p.pos==='BR'?'Obrony / 90':'Podania progresywne / 90')+'</b><div class="sub">ostatnie '+trend.length+' meczów</div></div>'+spark(trend)+'</div><div class="statsline">'+trend.map(function(v){return'<span><b>'+v.toFixed(1)+'</b></span>'}).join('')+'</div></div><div class="section"><div><h3>Ostatnie mecze</h3><p>Porównanie bez oceniania, który występ był lepszy.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Mecz</th><th>Minuty</th><th>Plusy</th><th>Błędy</th><th>'+esc(metricMeta(metric).name)+'/90</th></tr></thead><tbody>'+a.ms.slice().sort(function(x,y){return y.date.localeCompare(x.date)}).slice(0,5).map(function(m){var mins=pmins(m,pid),pl=m.events.filter(function(e){return e.pid===pid&&e.type==='plus'}).length,mi=m.events.filter(function(e){return e.pid===pid&&e.type==='minus'}).length;return'<tr onclick="closeM();playerReport(\''+m.id+'\',\''+pid+'\')"><td>'+esc(m.date)+' • '+esc(m.opp)+'</td><td>'+mins+'</td><td>'+pl+'</td><td>'+mi+'</td><td>'+per90(valsFor(m,pid)[metric]||0,mins)+'</td></tr>'}).join('')+'</tbody></table></div>';openM()}
function backup(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='matchlab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function openM(){modal.classList.add('on')}function closeM(){modal.classList.remove('on')}modal.addEventListener('click',function(e){if(e.target===modal)closeM()});init();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
