<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchLab Coach</title>
<style>
:root{--bg:#07110c;--card:#0e1c14;--line:#244532;--txt:#f4f7f5;--mut:#9eb2a6;--g:#35c978;--r:#ef6464}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#06100b,#0a1710);color:var(--txt);font:14px system-ui,Segoe UI,Arial;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;padding:13px 18px;background:#07110cee;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.brand{font-weight:900;font-size:18px}.brand b{color:var(--g)}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#14241a;color:white;padding:9px 12px;border-radius:11px;font-weight:750}.btn:hover{background:#193020}.btn.p{background:var(--g);color:#04130a;border:0}.btn.d{background:#3a1717;color:#ffd0d0}.wrap{max-width:1450px;margin:auto;padding:16px}.page{display:none}.page.on{display:block}
.card{background:linear-gradient(180deg,var(--card),#0a1710);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}h1,h2,h3{margin:0 0 10px}.mut{color:var(--mut)}label{display:block;color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;margin:0 0 5px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #315640;background:#07110c;color:white;outline:none}textarea{min-height:80px}
.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.pc{background:#0b1811;border:1px solid var(--line);border-radius:13px;padding:11px}.ph{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{width:34px;height:34px;border-radius:50%;background:#183926;display:grid;place-items:center;font-weight:900}.nm{font-weight:900}
.live{display:grid;grid-template-columns:310px 1fr;gap:12px}.list{display:grid;gap:7px}.pl{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px;background:#0b1811}.pl.on{border-color:var(--g);background:#10251a}.pos{padding:4px 7px;border-radius:999px;background:#193a27;font-size:11px;font-weight:900}.clock{font-size:28px;color:var(--g);font-weight:900}.score{display:flex;gap:6px;align-items:center}.score input{width:58px;text-align:center;font-size:19px;font-weight:900}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ctr{border:1px solid var(--line);border-radius:13px;padding:10px;background:#0a1710}.ct{font-weight:850;min-height:34px}.cr{display:grid;grid-template-columns:40px 1fr 40px;gap:7px;align-items:center;margin-top:7px}.cr button{height:40px;border:0;border-radius:9px;font-size:21px;font-weight:900}.minus{background:#3a1919;color:#ffb1b1}.plus{background:#173d28;color:#8ff1b3}.val{text-align:center;font-size:23px;font-weight:900}.pm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.pm button{padding:14px;border:0;border-radius:12px;font-weight:900}.good{background:#154428;color:#91efb2}.bad{background:#482020;color:#ffabab}
.note{display:grid;grid-template-columns:130px 1fr auto;gap:7px}.timeline{max-height:230px;overflow:auto;margin-top:8px}.ti{padding:7px 0;border-bottom:1px solid #1d3829}.min{color:#f2c65b;font-weight:900;margin-right:8px}.empty{text-align:center;padding:25px;border:1px dashed #315640;border-radius:13px;color:var(--mut)}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:15px;z-index:20}.modal.on{display:grid}.mc{width:min(680px,100%);background:#0d1a13;border:1px solid var(--line);border-radius:16px;padding:16px}
.rep{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0;background:#0b1811}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#14271a;border-radius:8px;padding:5px 7px;font-size:12px}
@media(max-width:950px){.g4,.roster{grid-template-columns:repeat(2,1fr)}.live{grid-template-columns:1fr}.list{grid-template-columns:repeat(3,1fr)}.counters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g4,.g3,.g2,.roster,.list,.counters{grid-template-columns:1fr}.note{grid-template-columns:1fr}.wrap{padding:10px}.top{padding:10px}.livehead{display:block!important}}
@media print{body{background:white;color:#111}.top,.noprint{display:none!important}.wrap{max-width:none}.page{display:none!important}#reports{display:block!important}.card,.rep{background:white;color:#111;border:1px solid #bbb}}
</style>
</head>
<body>
<div class="top"><div class="brand">MATCH<b>LAB</b> COACH</div><div class="nav">
<button class="btn" onclick="go('setup')">Mecz</button><button class="btn" onclick="go('live')">LIVE</button><button class="btn" onclick="go('reports')">Raport</button><button class="btn" onclick="go('history')">Historia</button>
</div></div>
<div class="wrap">
<section id="setup" class="page on"><div class="card"><h2>Mecz i kadra</h2><p class="mut">Szybka analiza indywidualna podczas meczu. Dane zapisują się automatycznie w tej przeglądarce.</p>
<div class="grid g4"><div><label>Przeciwnik</label><input id="opp" oninput="meta()"></div><div><label>Data</label><input id="date" type="date" onchange="meta()"></div><div><label>Rozgrywki</label><input id="comp" oninput="meta()"></div><div><label>Miejsce</label><select id="venue" onchange="meta()"><option>Dom</option><option>Wyjazd</option></select></div></div>
<div class="row space" style="margin-top:16px"><h3>Kadra</h3><button class="btn p" onclick="openM('addM')">+ Dodaj zawodnika</button></div><div id="roster" class="roster"></div>
<div class="row" style="margin-top:14px"><button class="btn p" onclick="start()">ROZPOCZNIJ ANALIZĘ</button><button class="btn" onclick="demo()">Przykładowa kadra</button><button class="btn d" onclick="resetMatch()">Wyczyść mecz</button></div></div></section>

<section id="live" class="page">
<div class="card livehead" style="display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center">
<div><div class="mut">MECZ</div><h2 id="lt">—</h2></div><div class="score"><input id="su" type="number" min="0" onchange="score()"><b>:</b><input id="st" type="number" min="0" onchange="score()"></div>
<div class="row"><div><div class="mut">MINUTA</div><div id="clock" class="clock">0'</div></div><button class="btn" onclick="minute()">+1 min</button></div></div>
<div class="live"><div class="card"><div class="row space"><h3>Na boisku</h3><button class="btn" onclick="openSub()">Zmiana</button></div><div id="field" class="list"></div><h3 style="margin-top:16px">Ławka</h3><div id="bench" class="list"></div></div>
<div id="panel" class="card"><div class="empty">Wybierz zawodnika.</div></div></div></section>

<section id="reports" class="page"><div class="row space" style="margin-bottom:10px"><div><h2>Raport pomeczowy</h2><div id="rt" class="mut"></div></div><div class="row noprint"><button class="btn" onclick="window.print()">Drukuj / Zapisz PDF</button><button class="btn p" onclick="archive()">Zapisz do historii</button></div></div><div id="report"></div></section>
<section id="history" class="page"><div class="card"><h2>Historia meczów</h2><div id="hist"></div></div></section>
</div>

<div id="addM" class="modal"><div class="mc"><div class="row space"><h3>Dodaj zawodnika</h3><button class="btn" onclick="closeM('addM')">✕</button></div>
<div class="grid g4"><div style="grid-column:span 2"><label>Imię i nazwisko</label><input id="pn"></div><div><label>Numer</label><input id="pno" type="number"></div><div><label>Pozycja</label><input id="pp" placeholder="np. 8"></div></div>
<div style="margin-top:10px"><label>Status</label><select id="ps"><option value="starter">Pierwszy skład</option><option value="bench">Ławka</option><option value="out">Poza kadrą</option></select></div><button class="btn p" style="margin-top:12px" onclick="addPlayer()">Dodaj</button></div></div>
<div id="subM" class="modal"><div class="mc"><div class="row space"><h3>Zmiana</h3><button class="btn" onclick="closeM('subM')">✕</button></div><div class="grid g2"><div><label>Schodzi</label><select id="out"></select></div><div><label>Wchodzi</label><select id="inn"></select></div></div><button class="btn p" style="margin-top:12px" onclick="sub()">Zatwierdź</button></div></div>

<script>
const EV=["Strzały","Strzały celne","Gole","Asysty","Kluczowe podania","Udane dryblingi","Straty","Odbiory","Przechwyty","Wygrane pojedynki","Przegrane pojedynki","Dobry pressing","Błąd w pressingu","Atak przestrzeni","Zejście do piłki","Ruch za linię","Wejście w pole karne","Gra na ścianę","Dobra reakcja po stracie","Brak reakcji po stracie"];
const QUICK=["Strzały","Straty","Wygrane pojedynki","Dobry pressing","Atak przestrzeni","Zejście do piłki","Ruch za linię","Wejście w pole karne"];
const KEY="matchlab_public_v1", HK="matchlab_history_public_v1";
const fresh=()=>({m:{opp:"",date:new Date().toISOString().slice(0,10),comp:"",venue:"Dom",us:0,them:0,min:0},r:[]});
let S=JSON.parse(localStorage.getItem(KEY)||"null")||fresh(),sel=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)), id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function go(x){document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));document.getElementById(x).classList.add("on");if(x==="reports")reports();if(x==="history")history()}
function openM(x){document.getElementById(x).classList.add("on")}function closeM(x){document.getElementById(x).classList.remove("on")}
function meta(){S.m.opp=opp.value;S.m.date=date.value;S.m.comp=comp.value;S.m.venue=venue.value;save();header()}
function score(){S.m.us=+su.value||0;S.m.them=+st.value||0;save()}
function hydrate(){opp.value=S.m.opp;date.value=S.m.date;comp.value=S.m.comp;venue.value=S.m.venue;su.value=S.m.us;st.value=S.m.them;render()}
function addPlayer(){if(!pn.value.trim())return;let p={id:id(),name:pn.value.trim(),no:+pno.value||0,pos:pp.value.trim()||"?",status:ps.value,on:ps.value==="starter",in:ps.value==="starter"?0:null,out:null,e:{},good:0,bad:0,notes:[]};EV.forEach(e=>p.e[e]=0);S.r.push(p);pn.value=pno.value=pp.value="";save();closeM("addM");render()}
function demo(){if(S.r.length&&!confirm("Dodać przykładową kadrę?"))return;["GK","RB","RCB","LCB","LB","6","8","10","RW","LW","9","GK","CB","8","RW","9"].forEach((pos,i)=>{let p={id:id(),name:"Zawodnik "+(i+1),no:i+1,pos,status:i<11?"starter":"bench",on:i<11,in:i<11?0:null,out:null,e:{},good:0,bad:0,notes:[]};EV.forEach(e=>p.e[e]=0);S.r.push(p)});save();render()}
function status(id,v){let p=S.r.find(x=>x.id===id);p.status=v;p.on=v==="starter";p.in=p.on?0:null;save();render()}
function del(id){if(confirm("Usunąć zawodnika?")){S.r=S.r.filter(x=>x.id!==id);save();render()}}
function roster(){roster.innerHTML=S.r.length?S.r.map(p=>`<div class="pc"><div class="ph"><div class="row"><div class="num">${p.no||"–"}</div><div><div class="nm">${esc(p.name)}</div><div class="mut">${esc(p.pos)}</div></div></div><button class="btn d" onclick="del('${p.id}')">✕</button></div><div style="margin-top:8px"><select onchange="status('${p.id}',this.value)"><option value="starter" ${p.status==="starter"?"selected":""}>Pierwszy skład</option><option value="bench" ${p.status==="bench"?"selected":""}>Ławka</option><option value="out" ${p.status==="out"?"selected":""}>Poza kadrą</option></select></div></div>`).join(""):'<div class="empty" style="grid-column:1/-1">Dodaj zawodników.</div>'}
function start(){if(!S.m.opp)return alert("Wpisz przeciwnika.");S.r.forEach(p=>{p.on=p.status==="starter";if(p.on&&p.in==null)p.in=0});save();render();go("live")}
function header(){lt.textContent=S.m.opp?`vs ${S.m.opp} • ${S.m.venue}`:"—";clock.textContent=S.m.min+"'";rt.textContent=`${S.m.date} • ${S.m.venue} • ${S.m.us}:${S.m.them} vs ${S.m.opp}`}
function playerRow(p){return `<div class="pl ${sel===p.id?"on":""}" onclick="choose('${p.id}')"><div class="num">${p.no||"–"}</div><div><div class="nm">${esc(p.name)}</div><div class="mut">${p.good}+ / ${p.bad}-</div></div><span class="pos">${esc(p.pos)}</span></div>`}
function lists(){let f=S.r.filter(p=>p.on),b=S.r.filter(p=>!p.on&&p.status!=="out"&&p.out==null);field.innerHTML=f.map(playerRow).join("")||'<div class="empty">Brak.</div>';bench.innerHTML=b.map(playerRow).join("")||'<div class="empty">Brak.</div>'}
function choose(x){sel=x;lists();panelRender()}
function event(n,d){let p=S.r.find(x=>x.id===sel);p.e[n]=Math.max(0,(p.e[n]||0)+d);save();panelRender()}
function rate(t){let p=S.r.find(x=>x.id===sel);p[t]++;p.notes.unshift({min:S.m.min,type:t,text:t==="good"?"Dobre zachowanie":"Błąd / złe zachowanie"});save();lists();panelRender()}
function note(){let p=S.r.find(x=>x.id===sel);if(!nt.value.trim())return;p.notes.unshift({min:S.m.min,type:ntype.value,text:nt.value.trim()});nt.value="";save();panelRender()}
function panelRender(){let p=S.r.find(x=>x.id===sel);if(!p)return;panel.innerHTML=`<div class="row space"><div><div class="mut">ANALIZA LIVE</div><h2>${esc(p.name)} #${p.no||"–"}</h2><span class="pos">${esc(p.pos)}</span></div><button class="btn" onclick="allCounters()">Wszystkie liczniki</button></div><div class="counters">${QUICK.map(n=>ctr(p,n)).join("")}</div><div class="pm"><button class="good" onclick="rate('good')">+ DOBRE <b>${p.good}</b></button><button class="bad" onclick="rate('bad')">− BŁĄD <b>${p.bad}</b></button></div><h3>Szybka notatka</h3><div class="note"><select id="ntype"><option value="good">Plus</option><option value="bad">Minus</option><option value="improve">Do poprawy</option><option value="note">Notatka</option></select><input id="nt" placeholder="np. za późno do pressingu" onkeydown="if(event.key==='Enter')note()"><button class="btn p" onclick="note()">Dodaj</button></div><div class="timeline">${p.notes.map(n=>`<div class="ti"><span class="min">${n.min}'</span>${esc(n.text)}</div>`).join("")||'<div class="mut" style="margin-top:8px">Brak notatek.</div>'}</div>`}
function ctr(p,n){return `<div class="ctr"><div class="ct">${esc(n)}</div><div class="cr"><button class="minus" onclick="event('${n}',-1)">−</button><div class="val">${p.e[n]||0}</div><button class="plus" onclick="event('${n}',1)">+</button></div></div>`}
function allCounters(){let p=S.r.find(x=>x.id===sel);panel.innerHTML=`<div class="row space"><h2>${esc(p.name)} — wszystkie liczniki</h2><button class="btn" onclick="panelRender()">← Powrót</button></div><div class="counters">${EV.map(n=>ctr(p,n)).join("")}</div>`}
function minute(){S.m.min++;save();header();if(sel)panelRender()}
function openSub(){out.innerHTML=S.r.filter(p=>p.on).map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.pos)})</option>`).join("");inn.innerHTML=S.r.filter(p=>!p.on&&p.status!=="out"&&p.out==null).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("");openM("subM")}
function sub(){let a=S.r.find(p=>p.id===out.value),b=S.r.find(p=>p.id===inn.value);if(!a||!b)return;a.on=false;a.out=S.m.min;b.on=true;b.in=S.m.min;b.pos=a.pos;sel=b.id;save();closeM("subM");render()}
function reports(){let played=S.r.filter(p=>p.in!=null||p.on);report.innerHTML=`<div class="card"><h2>Podsumowanie meczu</h2><div class="mut">${esc(S.m.date)} • ${esc(S.m.comp)} • ${S.m.us}:${S.m.them} vs ${esc(S.m.opp)}</div></div>`+played.map(p=>{let mins=Math.max(0,(p.out??S.m.min)-(p.in??0)),stats=Object.entries(p.e).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return `<div class="rep"><div class="row space"><div><h3>${esc(p.name)} #${p.no||"–"}</h3><div class="mut">${esc(p.pos)} • ${mins} min</div></div><b>${p.good}+ / ${p.bad}-</b></div><div class="chips">${stats.map(x=>`<span class="chip">${esc(x[0])}: <b>${x[1]}</b></span>`).join("")||'<span class="mut">Brak statystyk.</span>'}</div><div class="grid g3" style="margin-top:10px"><div><b style="color:#75e9a1">PLUSY</b><ul>${p.notes.filter(n=>n.type==="good").map(n=>`<li>${n.min}' ${esc(n.text)}</li>`).join("")}</ul></div><div><b style="color:#ff9292">MINUSY</b><ul>${p.notes.filter(n=>n.type==="bad").map(n=>`<li>${n.min}' ${esc(n.text)}</li>`).join("")}</ul></div><div><b>DO POPRAWY</b><ul>${p.notes.filter(n=>n.type==="improve").map(n=>`<li>${n.min}' ${esc(n.text)}</li>`).join("")}</ul></div></div></div>`}).join("")}
function archive(){let h=JSON.parse(localStorage.getItem(HK)||"[]");h.unshift(JSON.parse(JSON.stringify(S)));localStorage.setItem(HK,JSON.stringify(h));alert("Mecz zapisany.");history()}
function history(){let h=JSON.parse(localStorage.getItem(HK)||"[]");hist.innerHTML=h.map((m,i)=>`<div class="rep"><div class="row space"><div><b>${esc(m.m.date)} • vs ${esc(m.m.opp)}</b><div class="mut">${m.m.us}:${m.m.them} • ${esc(m.m.venue)}</div></div><button class="btn" onclick="loadHist(${i})">Otwórz</button></div></div>`).join("")||'<div class="empty">Brak zapisanych meczów.</div>'}
function loadHist(i){S=JSON.parse(localStorage.getItem(HK))[i];save();sel=null;hydrate();go("reports")}
function resetMatch(){if(confirm("Wyczyścić bieżący mecz?")){S=fresh();sel=null;save();hydrate()}}
function render(){roster();header();lists();if(sel)panelRender()} hydrate();
</script></body></html>
