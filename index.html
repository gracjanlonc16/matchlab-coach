p:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.kpi{min-height:112px;display:flex;flex-direction:column;justify-content:space-between}.kpi strong{font-size:27px;letter-spacing:-.04em}.mut{color:var(--mut)}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 12px}.section h3{margin:0;font-size:16px}.section p{margin:4px 0 0;font-size:12px;color:var(--mut)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}input,select,textarea{width:100%;border:1px solid #DDD7CE;background:#fff;padding:10px 11px;border-radius:10px;outline:none;color:var(--black)}input:focus,select:focus,textarea:focus{border-color:#8d8374;box-shadow:0 0 0 3px rgba(184,167,141,.14)}textarea{min-height:80px;resize:vertical}.form4{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.span2{grid-column:span 2}.span4{grid-column:1/-1}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.pc{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.pc:hover{border-color:#cfc4b5}.num{width:32px;height:32px;border-radius:9px;background:#151515;color:#fff;display:grid;place-items:center;font-weight:900}.name{font-weight:900;text-transform:uppercase;margin-top:8px}.sub{font-size:11px;color:var(--mut);margin-top:3px}.stats{display:flex;gap:11px;border-top:1px solid #f0ece6;margin-top:12px;padding-top:10px;font-size:11px;color:var(--mut)}.stats b{color:var(--black)}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:10px;border-bottom:1px solid var(--line)}.table td{padding:13px 10px;border-bottom:1px solid #f0ece6}.table tbody tr{cursor:pointer}.table tbody tr:hover{background:# x;color:var(--mut)}.metricgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:12px;padding:9px}.metric .mn{min-height:28px;font-size:10px;font-weight:850}.mc{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;align-items:center;margin-top:7px}.mc button{height:36px;border:0;border-radius:9px;font-size:19px;font-weight:900}.minus{background:var(--badbg);color:var(--bad)}.plus{background:var(--goodbg);color:var(--good)}.val{text-align:center;font-size:21px;font-weight:950}.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.quick button{padding:15px;border:0;border-radius:12px;font-weight:900}.qg{background:var(--goodbg);color:var(--good)}.qb{background:var(--badbg);color:var(--bad)}.note{display:grid;grid-template-columns:120px 1fr auto;gap:7px;margin-top:10px}.timeline{margin-top:10px;border-top:1px solid var(--line);max-height:200px;overflow:auto}.ti{padding:8px 2px;border-bottom:1px solid #f0ece6;font-size:11px}.ti b{display:inline-block;min-width:34px}.report{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:10px}.login{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center;padding:18px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:var(--shadow)}.loginbox h2{margin:18px 0 6px}.toast{position:fixed;left:50%;bottom:18px;z-index:300;transform:translate(-50%,10px);background:#151515;color:#fff;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800;opacity:0;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}.mobile{display:none}
@media(max-width:1000px){.g4,.players{grid-template-columns:repeat(2,1fr)}.metricgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:18px 14px 80px}.mobile{display:grid;position:fixed;left:10px;right:10px;bottom:10px;z-index:40;background:#151515;border-radius:15px;padding:5px;grid-template-columns:repeat(4,1fr)}.mobile button{border:0;background:transparent;color:#aaa69d;padding:9px 2px;font-size:9px;font-weight:850;border-radius:9px}.mobile button.on{background:#F2EDE4;color:#151515}.livebody{grid-template-columns:1fr}.livecard:first-child{order:2}.form4{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:26px}.g4,.g3,.g2,.players,.form4{grid-template-columns:1fr}.span2,.span4{grid-column:auto}.metricgrid{grid-template-columns:1fr 1fr}.note{grid-template-columns:1fr}.livehead{grid-template-columns:1fr auto}.clock{display:none}.sqrow{grid-template-columns:1fr 1fr}.sqrow .who{grid-column:1/-1}.tablewrap{overflow:auto}.table{min-width:650px}}@media print{.side,.top,.mobile,.btn,.live,.modal,.login,.toast{display:none!important}.shell{display:block}.content{padding:0;max-width:none}.page{display:none!important}#report{display:block!important}.card,.report{box-shadow:none}}

<body>
<div id="login" class="login"><div class="loginbox"><div style="font-weight:950;letter-spacing:.06em;font-size:20px">MATCHLAB COACH</div><div class="eyebrow" style="margin-top:5px">PRIVATE FOOTBALL ANALYTICS</div><h2 id="ltitle">Zaloguj się</h2><p class="mut" id="ltext">Prywatny dostęp do aplikacji.</p><div class="field"><label>E-mail</label><input id="lemail" type="email"></div><div class="field" style="margin-top:9px"><label>Hasło</label><input id="lpass" type="password"></div><div id="lconfirmwrap" class="field hidden" style="margin-top:9px"><label>Powtórz hasło</label><input id="lconfirm" type="password"></div><button id="lbtn" class="btn primary" style="width:100%;margin-top:12px" onclick="auth()">ZALOGUJ</button><div id="lmsg" class="mut" style="font-size:11px;margin-top:8px"></div></div></div>
<div class="shell"><aside class="side"><div class="logo">MATCHLAB COACH<small>COACH ANALYTICS</small></div><div class="nav"><button data-p="dash" onclick="go('dash')">Dashboard</button><button data-p="matches" onclick="go('matches')">Mecze</button><button data-p="players" onclick="go('players')">Zawodnicy</button><button data-p="stats" onclick="go('stats')">Statystyki</button></div><div class="sidefoot"><b id="seasonSide">2026/27</b><br>Autosave aktywny</div></aside><main class="main"><header class="top"><b id="ptitle">Dashboard</b><button class="btn primary sm" onclick="newMatch()">+ NOWY MECZ</button></header><div class="content"><section id="dash" class="page on"></section><section id="matches" class="page"></section><section id="players" class="page"></section><section id="stats" class="page"></section><section id="report" class="page"></section></div></main></div>
<div class="mobile"><button data-p="dash" onclick="go('dash')">DASH</button><button data-p="matches" onclick="go('matches')">MECZE</button><button data-p="players" onclick="go('players')">KADRA</button><button data-p="stats" onclick="go('stats')">STAT</button></div>
<div id="live" class="live"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
var KEY='matchlab_premium_v3';var S=JSON.parse(localStorage.getItem(KEY)||'null')||{season:'2026/27',players:[],matches:[],active:null,auth:null};var sel=null,timer=null;
var MET=[['shot','Strzał'],['shot_on','Strzał celny'],['goal','Gol'],['assist','Asysta'],['key','Kluczowe podanie'],['drib','Udany drybling'],['loss','Strata'],['tackle','Odbiór'],['inter','Przechwyt'],['duel','Wygrany pojedynek'],['press','Dobry pressing'],['late','Spóźniony pressing'],['space','Atak przestrzeni'],['drop','Zejście do piłki'],['behind','Ruch za linię'],['box','Wejście w pole karne'],['wall','Gra na ścianę'],['react','Dobra reakcja po stracie'],['rest','Rest defence'],['cover','Asekuracja']];
var PROFILE={'9':['drop','wall','behind','space','box','press'],'RW':['drib','space','behind','box','press','react'],'LW':['drib','space','behind','box','press','react'],'8':['key','space','box','cover','press','react'],'6':['key','tackle','inter','rest','cover'],'RB':['drib','tackle','duel','cover'],'LB':['drib','tackle','duel','cover'],'RCB':['duel','inter','rest','cover'],'LCB':['duel','inter','rest','cover'],'10':['key','space','box','press'],'GK':['inter']};
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function flash(t){toast.textContent=t;toast.classList.add('on');setTimeout(function(){toast.classList.remove('on')},1200)}
async function hash(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function init(){if(!S.auth){ltitle.textContent='Utwórz dostęp';ltext.textContent='Ustaw login dla tej instalacji MATCHLAB COACH.';lconfirmwrap.classList.remove('hidden');lbtn.textContent='UTWÓRZ DOSTĘP';login.dataset.mode='setup'}else if(sessionStorage.getItem('mlog')==='1'){login.classList.add('hidden');renderAll()}else{login.dataset.mode='login';lemail.value=S.auth.email||''}}async function auth(){lmsg.textContent='';var e=lemail.value.trim().toLowerCase(),p=lpass.value;if(!e||p.length<6){lmsg.textContent='Podaj e-mail i hasło min. 6 znaków.';return}var h=await hash(p);if(login.dataset.mode==='setup'){if(p!==lconfirm.value){lmsg.textContent='Hasła nie są identyczne.';return}S.auth={email:e,hash:h};save();sessionStorage.setItem('mlog','1');login.classList.add('hidden');renderAll()}else if(S.auth.email===e&&S.auth.hash===h){sessionStorage.setItem('mlog','1');login.classList.add('hidden');renderAll()}else lmsg.textContent='Nieprawidłowy login.'}
function go(p){document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on')});document.getElementById(p).classList.add('on');document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)});ptitle.textContent={dash:'Dashboard',matches:'Mecze',players:'Zawodnicy',stats:'Statystyki',report:'Raport'}[p];if(p==='dash')dashR();if(p==='matches')matchesR();if(p==='players')playersR();if(p==='stats')statsR();scrollTo(0,0)}
function renderAll(){seasonSide.textContent=S.season;dashR();matchesR();playersR();statsR();go('dash')}
function finished(){return S.matches.filter(function(m){return m.status==='finished'})}
function dashR(){var a=finished().slice().sort(function(a,b){return b.date.localeCompare(a.date)}),last=a[0];dash.innerHTML='<div class="hero"><div><div class="eyebrow">MATCHLAB COACH</div><h1>Analiza, która nie odrywa od meczu.</h1><p>Sezon '+esc(S.season)+' • '+S.players.filter(function(p){return p.active!==false}).length+' aktywnych zawodników</p></div><button class="btn primary" onclick="newMatch()">+ NOWY MECZ</button></div><div class="grid g4"><div class="card kpi"><span class="eyebrow">Mecze</span><strong>'+a.length+'</strong><span class="mut">zakończone</span></div><div class="card kpi"><span class="eyebrow">Zawodnicy</span><strong>'+S.players.length+'</strong><span class="mut">profili</span></div><div class="card kpi"><span class="eyebrow">Ostatni mecz</span><strong style="font-size:18px">'+(last?esc(last.opp):'—')+'</strong><span class="mut">'+(last?last.us+':'+last.them+' • '+last.date:'Brak danych')+'</span></div><div class="card kpi"><span class="eyebrow">Najbliższa analiza</span><strong style="font-size:18px">'+(S.active?'LIVE':'GOTOWY')+'</strong><span class="mut">'+(S.active?'aktywny mecz':'utwórz mecz')+'</span></div></div><div class="section"><div><h3>Ostatnie mecze</h3><p>Szybki dostęp do raportów.</p></div></div>'+matchTable(a.slice(0,5))}
function matchTable(a){if(!a.length)return'<div class="empty">Nie masz jeszcze zapisanych meczów.</div>';return'<div class="card tablewrap" style="padding:4px 10px"><table class="table"><thead><tr><th>Data</th><th>Przeciwnik</th><th>Wynik</th><th>Miejsce</th><th>Rozgrywki</th></tr></thead><tbody>'+a.map(function(m){return'<tr onclick="openReport(\''+m.id+'\')"><td>'+esc(m.date)+'</td><td><b>'+esc(m.opp)+'</b></td><td><b>'+m.us+':'+m.them+'</b></td><td>'+esc(m.venue)+'</td><td>'+esc(m.comp||'—')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function matchesR(){var a=S.matches.slice().sort(function(a,b){return b.date.localeCompare(a.date)});matches.innerHTML='<div class="hero"><div><div class="eyebrow">HISTORIA</div><h1>Mecze</h1><p>Składy, minuty, zdarzenia i raporty.</p></div><button class="btn primary" onclick="newMatch()">+ NOWY MECZ</button></div>'+matchTable(a)}
function playersR(){players.innerHTML='<div class="hero"><div><div class="eyebrow">KADRA</div><h1>Zawodnicy</h1><p>Stała baza zawodników.</p></div><button class="btn primary" onclick="playerModal()">+ DODAJ ZAWODNIKA</button></div><div class="players">'+(S.players.length?S.players.map(pcard).join(''):'<div class="empty" style="grid-column:1/-1">Dodaj pierwszego zawodnika.</div>')+'</div>'}
function pcard(p){var ms=finished().filter(function(m){return m.squad.some(function(s){return s.pid===p.id})}),mins=ms.reduce(function(a,m){return a+pmins(m,p.id)},0);return'<div class="pc"><div class="row space"><div class="num">'+esc(p.no||'—')+'</div><button class="btn sm" onclick="playerModal(\''+p.id+'\')">Edytuj</button></div><div class="name">'+esc(p.name)+'</div><div class="sub">'+esc(p.pos)+'</div><div class="stats"><span><b>'+mins+'</b> min</span><span><b>'+ms.length+'</b> mecz.</span></div></div>'}
function playerModal(pid){var p=S.players.find(function(x){return x.id===pid});modalbox.innerHTML='<div class="row space"><div><div class="eyebrow">'+(p?'EDYCJA':'NOWY PROFIL')+'</div><h3 style="margin:4px 0 14px">Zawodnik</h3></div><button class="btn" onclick="closeM()">✕</button></div><div class="form4"><div class="field span2"><label>Imię i nazwisko</label><input id="pn" value="'+esc(p?p.name:'')+'"></div><div class="field"><label>Numer</label><input id="pno" value="'+esc(p?p.no:'')+'"></div><div class="field"><label>Pozycja</label><input id="ppos" value="'+esc(p?p.pos:'')+'"></div><div class="field span4"><label>Notatki</label><textarea id="pnotes">'+esc(p?p.notes:'')+'</textarea></div></div><div class="row space" style="margin-top:14px">'+(p?'<button class="btn bad" onclick="delPlayer(\''+p.id+'\')">Usuń</button>':'<span></span>')+'<button class="btn primary" onclick="savePlayer(\''+(p?p.id:'')+'\')">ZAPISZ</button></div>';openM()}
function savePlayer(pid){if(!pn.value.trim())return;var o={id:pid||id(),name:pn.value.trim(),no:pno.value.trim(),pos:ppos.value.trim()||'?',notes:pnotes.value.trim(),active:true};if(pid)S.players=S.players.map(function(p){return p.id===pid?o:p});else S.players.push(o);save();closeM();playersR();dashR()}function delPlayer(pid){if(!confirm('Usunąć zawodnika?'))return;S.players=S.players.filter(function(p){return p.id!==pid});save();closeM();playersR();dashR()}
function newMatch(){if(!S.players.length){flash('Najpierw dodaj zawodników');go('players');return}modalbox.innerHTML='<div class="row space"><div><div class="eyebrow">KONFIGURACJA</div><h3 style="margin:4px 0 14px">Nowy mecz</h3></div><button class="btn" onclick="closeM()">✕</button></div><div class="form4"><div class="field span2"><label>Przeciwnik</label><input id="mo"></div><div class="field"><label>Data</label><input id="md" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Rozgrywki</label><input id="mc"></div><div class="field"><label>Miejsce</label><select id="mv"><option>Dom</option><option>Wyjazd</option></select></div><div class="field span2"><label>Boisko</label><input id="mp"></div><div class="field span4"><label>Uwagi przed meczem</label><textarea id="mnote"></textarea></div></div><div class="section"><div><h3>Wybierz kadrę</h3><p>Pierwszy skład / ławka / poza kadrą.</p></div></div><div class="squad">'+S.players.map(function(p){return'<div class="sqrow"><div class="who row"><div class="num">'+esc(p.no||'—')+'</div><div><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.pos)+'</div></div></div><select id="r_'+p.id+'"><option value="out">Poza kadrą</option><option value="bench">Ławka</option><option value="starter">Pierwszy skład</option></select><input id="z_'+p.id+'" value="'+esc(p.pos)+'"></div>'}).join('')+'</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="createMatch()">ROZPOCZNIJ ANALIZĘ</button>';openM()}
function createMatch(){if(!mo.value.trim())return flash('Wpisz przeciwnika');var sq=S.players.map(function(p){var r=document.getElementById('r_'+p.id).value,pos=document.getElementById('z_'+p.id).value.trim()||p.pos;return{pid:p.id,role:r,pos:pos,on:r==='starter',inm:r==='starter'?0:null,outm:null,hist:r==='starter'?[{f:0,t:null,p:pos}]:[]}}).filter(function(s){return s.role!=='out'});var m={id:id(),opp:mo.value.trim(),date:md.value,comp:mc.value.trim(),venue:mv.value,pitch:mp.value.trim(),prem:mnote.value.trim(),us:0,them:0,min:0,half:1,status:'live',squad:sq,events:[],notes:[],subs:[]};S.matches.push(m);S.active=m.id;save();closeM();openLive(m.id)}
function openLive(mid){var m=getM(mid);if(!m)return;S.active=m.id;sel=(m.squad.find(function(s){return s.on})||m.squad[0]||{}).pid||null;save();live.classList.add('on');liveR()}
function getM(idv){return S.matches.find(function(m){return m.id===idv})}function getP(idv){return S.players.find(function(p){return p.id===idv})}function pmins(m,pid){var s=m.squad.find(function(x){return x.pid===pid});if(!s||s.inm==null)return 0;return Math.max(0,(s.outm==null?m.min:s.outm)-s.inm)}
function liveR(){var m=getM(S.active);if(!m)return;var on=m.squad.filter(function(s){return s.on}),bench=m.squad.filter(function(s){return !s.on&&s.outm==null}),s=m.squad.find(function(x){return x.pid===sel}),p=s?getP(s.pid):null;live.innerHTML='<div class="livehead"><div><div class="eyebrow">TRYB LIVE</div><div class="opp">'+esc(m.opp)+'</div><div class="sub">'+esc(m.venue)+' • '+esc(m.comp||'mecz')+'</div></div><div class="row"><button class="btn sm" onclick="score(-1,0)">−</button><div class="score">'+m.us+':'+m.them+'</div><button class="btn sm" onclick="score(1,0)">+</button><button class="btn sm" onclick="score(0,1)">+R</button></div><div class="clock">'+m.min+'\'<div style="margin-top:4px"><button class="btn sm" onclick="mplus()">+1 MIN</button></div></div></div><div class="livebody"><div class="livecard"><div class="row space"><div class="eyebrow">NA BOISKU</div><button class="btn sm" onclick="subModal()">ZMIANA</button></div><div class="plist">'+on.map(function(x){return prow(m,x)}).join('')+'</div><div class="eyebrow" style="margin-top:14px">ŁAWKA</div><div class="plist">'+bench.map(function(x){return prow(m,x)}).join('')+'</div></div><div class="livecard">'+(p?panel(m,p,s):'<div class="empty">Wybierz zawodnika.</div>')+'</div></div>'}
function prow(m,s){var p=getP(s.pid);if(!p)return'';var a=m.events.filter(function(e){return e.pid===p.id&&e.type==='plus'}).length,b=m.events.filter(function(e){return e.pid===p.id&&e.type==='minus'}).length;return'<div class="pl '+(sel===p.id?'sel':'')+'" onclick="sel=\''+p.id+'\';liveR()"><div class="pn">'+esc(p.no||'—')+'</div><div><div class="nm">'+esc(p.name)+'</div><div class="dt">'+esc(s.pos)+' • '+pmins(m,p.id)+' min</div></div><b style="font-size:10px">+'+a+' / −'+b+'</b></div>'}
function panel(m,p,s){var mids=PROFILE[s.pos]||['shot','loss','duel','press','space','box'];var vals={};m.events.filter(function(e){return e.pid===p.id&&e.type==='metric'}).forEach(function(e){vals[e.metric]=(vals[e.metric]||0)+e.val});return'<div class="row space"><div><div class="eyebrow">ANALIZA LIVE</div><h2 style="margin:4px 0 2px;text-transform:uppercase">'+esc(p.name)+' <span class="mut">#'+esc(p.no||'—')+'</span></h2><div class="sub">'+esc(s.pos)+' • '+pmins(m,p.id)+' min</div></div><div class="row"><button class="btn sm" onclick="posModal(\''+p.id+'\')">ZMIEŃ POZYCJĘ</button><button class="btn sm bad" onclick="endMatch()">KONIEC MECZU</button></div></div><div class="metricgrid">'+mids.map(function(mid){return metric(mid,vals[mid]||0,p.id)}).join('')+'</div><div class="quick"><button class="qg" onclick="quick(\''+p.id+'\',\'plus\')">+ DOBRE ZACHOWANIE</button><button class="qb" onclick="quick(\''+p.id+'\',\'minus\')">− BŁĄD</button></div><div class="note"><select id="nt"><option value="plus">PLUS</option><option value="minus">MINUS</option><option value="improve">DO POPRAWY</option><option value="note">NOTATKA</option></select><input id="nx" placeholder="Szybka notatka…" onkeydown="if(event.key===\'Enter\')noteSave(\''+p.id+'\')"><button class="btn primary" onclick="noteSave(\''+p.id+'\')">ZAPISZ</button></div><div class="timeline">'+m.notes.filter(function(n){return n.pid===p.id}).slice().reverse().map(function(n){return'<div class="ti"><b>'+n.min+'\'</b>'+esc(n.text)+'</div>'}).join('')+'</div>'}
function metric(mid,val,pid){var nm=(MET.find(function(x){return x[0]===mid})||[mid,mid])[1];return'<div class="metric"><div class="mn">'+esc(nm)+'</div><div class="mc"><button class="minus" onclick="metricD(\''+pid+'\',\''+mid+'\',-1)">−</button><div class="val">'+val+'</div><button class="plus" onclick="metricD(\''+pid+'\',\''+mid+'\',1)">+</button></div></div>'}
function metricD(pid,mid,v){var m=getM(S.active);m.events.push({id:id(),pid:pid,type:'metric',metric:mid,val:v,min:m.min,ts:Date.now()});save();liveR()}function quick(pid,t){var m=getM(S.active);m.events.push({id:id(),pid:pid,type:t,min:m.min,ts:Date.now()});save();liveR()}function noteSave(pid){if(!nx.value.trim())return;var m=getM(S.active);m.notes.push({id:id(),pid:pid,type:nt.value,text:nx.value.trim(),min:m.min,ts:Date.now()});save();liveR()}function score(a,b){var m=getM(S.active);m.us=Math.max(0,m.us+a);m.them=Math.max(0,m.them+b);save();liveR()}function mplus(){getM(S.active).min++;save();liveR()}
function subModal(){var m=getM(S.active),on=m.squad.filter(function(s){return s.on}),bench=m.squad.filter(function(s){return !s.on&&s.outm==null});modalbox.innerHTML='<div class="row space"><h3>Zmiana • '+m.min+'\'</h3><button class="btn" onclick="closeM()">✕</button></div><div class="grid g2"><div class="field"><label>Schodzi</label><select id="so">'+on.map(function(s){return'<option value="'+s.pid+'">'+esc(getP(s.pid).name)+'</option>'}).join('')+'</select></div><div class="field"><label>Wchodzi</label><select id="si">'+bench.map(function(s){return'<option value="'+s.pid+'">'+esc(getP(s.pid).name)+'</option>'}).join('')+'</select></div></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="subDo()">ZATWIERDŹ</button>';openM()}function subDo(){var m=getM(S.active),a=m.squad.find(function(s){return s.pid===so.value}),b=m.squad.find(function(s){return s.pid===si.value});if(!a||!b)return;a.on=false;a.outm=m.min;if(a.hist.length)a.hist[a.hist.length-1].t=m.min;b.on=true;b.inm=m.min;b.pos=a.pos;b.hist=[{f:m.min,t:null,p:b.pos}];m.subs.push({out:a.pid,inn:b.pid,min:m.min});sel=b.pid;save();closeM();liveR()}
function posModal(pid){var m=getM(S.active),s=m.squad.find(function(x){return x.pid===pid});modalbox.innerHTML='<div class="row space"><h3>Zmień pozycję</h3><button class="btn" onclick="closeM()">✕</button></div><div class="field"><label>Nowa pozycja</label><input id="np" value="'+esc(s.pos)+'"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="posDo(\''+pid+'\')">ZAPISZ • '+m.min+'\'</button>';openM()}function posDo(pid){var m=getM(S.active),s=m.squad.find(function(x){return x.pid===pid}),p=np.value.trim();if(!p)return;if(s.hist.length)s.hist[s.hist.length-1].t=m.min;s.pos=p;s.hist.push({f:m.min,t:null,p:p});save();closeM();liveR()}
function endMatch(){if(!confirm('Zakończyć mecz?'))return;var m=getM(S.active);m.status='finished';m.squad.filter(function(s){return s.on}).forEach(function(s){s.outm=m.min;if(s.hist.length)s.hist[s.hist.length-1].t=m.min});S.active=null;save();live.classList.remove('on');openReport(m.id)}
function openReport(mid){var m=getM(mid);if(!m)return;document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on')});report.classList.add('on');ptitle.textContent='Raport meczu';report.innerHTML='<div class="hero"><div><div class="eyebrow">PODSUMOWANIE MECZU</div><h1>'+m.us+':'+m.them+' vs '+esc(m.opp)+'</h1><p>'+esc(m.date)+' • '+esc(m.venue)+' • '+esc(m.comp||'—')+'</p></div><button class="btn" onclick="print()">EKSPORT PDF</button></div>'+m.squad.map(function(s){var p=getP(s.pid),vals={};m.events.filter(function(e){return e.pid===s.pid&&e.type==='metric'}).forEach(function(e){vals[e.metric]=(vals[e.metric]||0)+e.val});var plus=m.events.filter(function(e){return e.pid===s.pid&&e.type==='plus'}).length,minus=m.events.filter(function(e){return e.pid===s.pid&&e.type==='minus'}).length;return'<div class="report"><div class="row space"><div><div class="eyebrow">'+esc(p?p.name:'Zawodnik')+'</div><div style="font-size:22px;font-weight:900;margin-top:4px">'+esc(s.pos)+' • '+pmins(m,s.pid)+' min</div></div><div><span class="pill good">+'+plus+'</span> <span class="pill bad">−'+minus+'</span></div></div><div class="stats" style="flex-wrap:wrap">'+Object.keys(vals).filter(function(k){return vals[k]>0}).map(function(k){var n=(MET.find(function(x){return x[0]===k})||[k,k])[1];return'<span><b>'+esc(n)+': '+vals[k]+'</b></span>'}).join('')+'</div><div style="margin-top:10px">'+m.notes.filter(function(n){return n.pid===s.pid}).map(function(n){return'<div class="ti"><b>'+n.min+'\'</b>'+esc(n.text)+'</div>'}).join('')+'</div></div>'}).join('');goMark('report')}
function goMark(p){document.querySelectorAll('[data-p]').forEach(function(b){b.classList.toggle('on',b.dataset.p===p)})}
function statsR(){var rows=S.players.map(function(p){var ms=finished().filter(function(m){return m.squad.some(function(s){return s.pid===p.id})}),mins=ms.reduce(function(a,m){return a+pmins(m,p.id)},0),plus=ms.reduce(function(a,m){return a+m.events.filter(function(e){return e.pid===p.id&&e.type==='plus'}).length},0),minus=ms.reduce(function(a,m){return a+m.events.filter(function(e){return e.pid===p.id&&e.type==='minus'}).length},0);return{p:p,ms:ms.length,mins:mins,plus:plus,minus:minus}}).sort(function(a,b){return b.mins-a.mins});stats.innerHTML='<div class="hero"><div><div class="eyebrow">SEZON '+esc(S.season)+'</div><h1>Statystyki</h1><p>Sumy i dane / 90 bez automatycznego rankingu.</p></div></div><div class="card tablewrap" style="padding:4px 10px"><table class="table"><thead><tr><th>Zawodnik</th><th>Mecze</th><th>Minuty</th><th>Plusy</th><th>Błędy</th><th>+/90</th><th>−/90</th></tr></thead><tbody>'+rows.map(function(r){return'<tr><td><b>'+esc(r.p.name)+'</b></td><td>'+r.ms+'</td><td>'+r.mins+'</td><td>'+r.plus+'</td><td>'+r.minus+'</td><td>'+(r.mins?(r.plus/r.mins*90).toFixed(1):'0.0')+'</td><td>'+(r.mins?(r.minus/r.mins*90).toFixed(1):'0.0')+'</td></tr>'}).join('')+'</tbody></table></div><div class="section"><div><h3>Backup</h3><p>Eksport wszystkich danych sezonu.</p></div><button class="btn" onclick="backup()">EKSPORT JSON</button></div>'}
function backup(){var b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='matchlab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function openM(){modal.classList.add('on')}function closeM(){modal.classList.remove('on')}modal.addEventListener('click',function(e){if(e.target===modal)closeM()});init();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});
</script>
